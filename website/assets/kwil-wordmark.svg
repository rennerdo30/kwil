      <stop offset="1" stop-color="#2f86ff"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5cc8ff"/>
      <stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/>
