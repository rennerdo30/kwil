[package]
name = "kwil"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A blazing fast plain text editor for GUI and terminal."
publish = false

[features]
frame-harness = ["kwil-ui-gpu/frame-harness"]

[[bin]]
name = "kwil"
path = "src/main.rs"

[dependencies]
kwil-bench = { path = "../bench" }
kwil-core-text = { path = "../core-text" }
kwil-view-model = { path = "../view-model" }
kwil-ui-gpu = { path = "../ui-gpu" }
kwil-ui-tui = { path = "../ui-tui" }
kwil-update = { path = "../update" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }
