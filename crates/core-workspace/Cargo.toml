[package]
name = "kwil-core-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bzip2 = "=0.6.1"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
lzma-rust2 = { version = "=0.25.0", default-features = false, features = ["std", "encoder", "xz"] }
zstd = { version = "=0.14.3", default-features = false }
ignore = "=0.4.33"
kwil-core-text = { path = "../core-text" }
notify = "8.2.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Globalization", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Memory"] }
