[package]
name = "kwil-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
harness = ["dep:kwil-core-text", "dep:serde_json"]

[dependencies]
kwil-core-text = { path = "../core-text", optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
divan = "=0.1.21"

[[bin]]
name = "kwil-bench"
path = "src/main.rs"
required-features = ["harness"]

[[bench]]
name = "text"
harness = false
required-features = ["harness"]
