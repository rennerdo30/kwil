[package]
name = "kwil-core-commands"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
fuzzy-matcher = "=0.3.7"
unicode-segmentation = "=1.13.3"
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }
kwil-core-workspace = { path = "../core-workspace" }
serde_json = "=1.0.154"
quick-xml = { version = "=0.41.0", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_Security", "Win32_UI_Shell"] }

