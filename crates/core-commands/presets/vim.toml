# Normal/Visual motions, operators, counts and ex commands are parsed by Vim.
# These explicit bindings and user overrides take precedence over that parser.
[[bindings]]
keys = "ctrl+s"
command = "file.save"
[[bindings]]
keys = "ctrl+shift+p"
command = "view.commandPalette"
[[bindings]]
keys = "ctrl+p"
command = "view.fileFinder"
[[bindings]]
keys = "ctrl+z"
command = "edit.undo"
context = "editor"
mode = "insert"
[[bindings]]
keys = "f7"
command = "compare.nextChange"
context = "diff"
[[bindings]]
keys = "shift+f7"
command = "compare.previousChange"
context = "diff"
[[bindings]]
keys = "enter"
command = "palette.accept"
context = "palette"
[[bindings]]
keys = "escape"
command = "palette.cancel"
context = "palette"
[[bindings]]
keys = "down"
command = "palette.next"
context = "palette"
[[bindings]]
keys = "up"
command = "palette.previous"
context = "palette"
[[bindings]]
keys = "enter"
command = "edit.newline"
context = "editor"
mode = "insert"
[[bindings]]
keys = "backspace"
command = "edit.backspace"
context = "editor"
mode = "insert"
[[bindings]]
keys = "delete"
command = "edit.delete"
context = "editor"
mode = "insert"
[[bindings]]
keys = "ctrl+backspace"
command = "edit.deleteWordBackward"
context = "editor"
mode = "insert"
[[bindings]]
keys = "ctrl+delete"
command = "edit.deleteWordForward"
context = "editor"
mode = "insert"
[[bindings]]
keys = "left"
command = "motion.left"
context = "editor"
mode = "insert"
[[bindings]]
keys = "right"
command = "motion.right"
context = "editor"
mode = "insert"
[[bindings]]
keys = "up"
command = "motion.up"
context = "editor"
mode = "insert"
[[bindings]]
keys = "down"
command = "motion.down"
context = "editor"
mode = "insert"
[[bindings]]
keys = "ctrl+left"
command = "motion.wordBackward"
context = "editor"
mode = "insert"
[[bindings]]
keys = "ctrl+right"
command = "motion.wordForward"
context = "editor"
mode = "insert"
[[bindings]]
keys = "home"
command = "motion.smartHome"
context = "editor"
mode = "insert"
[[bindings]]
keys = "end"
command = "motion.lineEnd"
context = "editor"
mode = "insert"
[[bindings]]
keys = "ctrl+home"
command = "motion.firstLine"
context = "editor"
mode = "insert"
[[bindings]]
keys = "ctrl+end"
command = "motion.lastLine"
context = "editor"
mode = "insert"
[[bindings]]
keys = "pageUp"
command = "motion.pageUp"
context = "editor"
mode = "insert"
[[bindings]]
keys = "pageDown"
command = "motion.pageDown"
context = "editor"
mode = "insert"

# Editor zoom: Plus is the literal '+' key, independent of keyboard layout.
[[bindings]]
keys = "ctrl+Plus"
command = "view.zoomIn"
[[bindings]]
keys = "ctrl+shift+Plus"
command = "view.zoomIn"
[[bindings]]
keys = "ctrl+="
command = "view.zoomIn"
[[bindings]]
keys = "ctrl+shift+="
command = "view.zoomIn"
[[bindings]]
keys = "ctrl+-"
command = "view.zoomOut"
[[bindings]]
keys = "ctrl+0"
command = "view.zoomReset"
[[bindings]]
keys = "ctrl+v"
command = "edit.paste"
context = "palette"
[[bindings]]
keys = "cmd+v"
command = "edit.paste"
context = "palette"

# GUI Find / Go to Line use explicit chords; Cmd remains distinct from Ctrl.
[[bindings]]
keys = "cmd+f"
command = "search.find"
[[bindings]]
keys = "cmd+g"
command = "navigation.goToLine"
# Missing explicit GUI routes; normal Vim /, n, N and modes remain intact.
[[bindings]]
keys = "ctrl+f"
command = "search.find"
[[bindings]]
keys = "ctrl+g"
command = "navigation.goToLine"
[[bindings]]
keys = "f3"
command = "search.findNext"
[[bindings]]
keys = "shift+f3"
command = "search.findPrevious"
