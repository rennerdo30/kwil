# Normal/Visual motions, operators, counts and ex commands are parsed by Vim.
# These explicit bindings and user overrides take precedence over that parser.
[[bindings]]
keys = "ctrl+s"
command = "file.save"
[[bindings]]
keys = "ctrl+shift+p"
command = "view.commandPalette"
[[bindings]]
keys = "ctrl+p"
command = "view.fileFinder"
[[bindings]]
keys = "ctrl+z"
command = "edit.undo"
context = "editor"
mode = "insert"
[[bindings]]
keys = "f7"
command = "compare.nextChange"
context = "diff"
[[bindings]]
keys = "shift+f7"
command = "compare.previousChange"
context = "diff"
[[bindings]]
keys = "enter"
command = "palette.accept"
context = "palette"
[[bindings]]
keys = "escape"
command = "palette.cancel"
context = "palette"
[[bindings]]
keys = "down"
command = "palette.next"
context = "palette"
[[bindings]]
keys = "up"
command = "palette.previous"
context = "palette"
