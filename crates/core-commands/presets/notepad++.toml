# Ctrl+Shift+P opens the command palette in all presets. This intentionally
# replaces Notepad++ macro playback: macros are outside Kwil v1.
[[bindings]]
keys = "ctrl+s"
command = "file.save"
[[bindings]]
keys = "ctrl+shift+s"
command = "file.saveAll"
[[bindings]]
keys = "ctrl+n"
command = "file.new"
[[bindings]]
keys = "ctrl+o"
command = "file.open"
[[bindings]]
keys = "ctrl+w"
command = "file.close"
[[bindings]]
keys = "ctrl+shift+t"
command = "file.reopenClosed"
[[bindings]]
keys = "ctrl+z"
command = "edit.undo"
context = "editor"
[[bindings]]
keys = "ctrl+y"
command = "edit.redo"
context = "editor"
[[bindings]]
keys = "ctrl+c"
command = "edit.copy"
[[bindings]]
keys = "ctrl+x"
command = "edit.cut"
context = "editor"
[[bindings]]
keys = "ctrl+v"
command = "edit.paste"
context = "editor"
[[bindings]]
keys = "ctrl+a"
command = "edit.selectAll"
context = "editor"
[[bindings]]
keys = "ctrl+d"
command = "edit.duplicateLine"
context = "editor"
[[bindings]]
keys = "ctrl+l"
command = "edit.cutLine"
context = "editor"
[[bindings]]
keys = "ctrl+g"
command = "navigation.goToLine"
[[bindings]]
keys = "ctrl+q"
command = "edit.toggleComment"
context = "editor"
[[bindings]]
keys = "ctrl+f"
command = "search.find"
[[bindings]]
keys = "ctrl+h"
command = "search.replace"
[[bindings]]
keys = "ctrl+shift+f"
command = "search.findInFiles"
[[bindings]]
keys = "f3"
command = "search.findNext"
[[bindings]]
keys = "shift+f3"
command = "search.findPrevious"
[[bindings]]
keys = "ctrl+shift+p"
command = "view.commandPalette"
[[bindings]]
keys = "f7"
command = "compare.nextChange"
context = "diff"
[[bindings]]
keys = "shift+f7"
command = "compare.previousChange"
context = "diff"
[[bindings]]
keys = "enter"
command = "palette.accept"
context = "palette"
[[bindings]]
keys = "escape"
command = "palette.cancel"
context = "palette"
[[bindings]]
keys = "down"
command = "palette.next"
context = "palette"
[[bindings]]
keys = "up"
command = "palette.previous"
context = "palette"

[[bindings]]
keys = "ctrl+alt+s"
command = "file.saveAs"
[[bindings]]
keys = "ctrl+shift+l"
command = "edit.deleteLine"
context = "editor"
[[bindings]]
keys = "ctrl+tab"
command = "file.nextTab"
[[bindings]]
keys = "ctrl+shift+tab"
command = "file.previousTab"
[[bindings]]
keys = "ctrl+k"
command = "edit.comment"
context = "editor"
[[bindings]]
keys = "ctrl+shift+k"
command = "edit.uncomment"
context = "editor"
[[bindings]]
keys = "ctrl+b"
command = "navigation.matchBracket"
context = "editor"
[[bindings]]
keys = "ctrl+r"
command = "file.reload"
[[bindings]]
keys = "ctrl+shift+w"
command = "file.closeAll"
[[bindings]]
keys = "ctrl+pageDown"
command = "file.nextTab"
[[bindings]]
keys = "ctrl+pageUp"
command = "file.previousTab"
[[bindings]]
keys = "ctrl+shift+z"
command = "edit.redo"
context = "editor"
[[bindings]]
keys = "tab"
command = "edit.indent"
context = "editor"
[[bindings]]
keys = "shift+tab"
command = "edit.outdent"
context = "editor"
[[bindings]]
keys = "ctrl+shift+up"
command = "edit.moveLineUp"
context = "editor"
[[bindings]]
keys = "ctrl+shift+down"
command = "edit.moveLineDown"
context = "editor"
[[bindings]]
keys = "enter"
command = "edit.newline"
context = "editor"
[[bindings]]
keys = "backspace"
command = "edit.backspace"
context = "editor"
[[bindings]]
keys = "delete"
command = "edit.delete"
context = "editor"
[[bindings]]
keys = "ctrl+backspace"
command = "edit.deleteWordBackward"
context = "editor"
[[bindings]]
keys = "ctrl+delete"
command = "edit.deleteWordForward"
context = "editor"
[[bindings]]
keys = "left"
command = "motion.left"
context = "editor"
[[bindings]]
keys = "right"
command = "motion.right"
context = "editor"
[[bindings]]
keys = "up"
command = "motion.up"
context = "editor"
[[bindings]]
keys = "down"
command = "motion.down"
context = "editor"
[[bindings]]
keys = "ctrl+left"
command = "motion.wordBackward"
context = "editor"
[[bindings]]
keys = "ctrl+right"
command = "motion.wordForward"
context = "editor"
[[bindings]]
keys = "home"
command = "motion.smartHome"
context = "editor"
[[bindings]]
keys = "end"
command = "motion.lineEnd"
context = "editor"
[[bindings]]
keys = "ctrl+home"
command = "motion.firstLine"
context = "editor"
[[bindings]]
keys = "ctrl+end"
command = "motion.lastLine"
context = "editor"
[[bindings]]
keys = "pageUp"
command = "motion.pageUp"
context = "editor"
[[bindings]]
keys = "pageDown"
command = "motion.pageDown"
context = "editor"

# Editor zoom: Plus is the literal '+' key, independent of keyboard layout.
[[bindings]]
keys = "ctrl+Plus"
command = "view.zoomIn"
[[bindings]]
keys = "ctrl+shift+Plus"
command = "view.zoomIn"
[[bindings]]
keys = "ctrl+="
command = "view.zoomIn"
[[bindings]]
keys = "ctrl+shift+="
command = "view.zoomIn"
[[bindings]]
keys = "ctrl+-"
command = "view.zoomOut"
[[bindings]]
keys = "ctrl+0"
command = "view.zoomReset"
[[bindings]]
keys = "ctrl+v"
command = "edit.paste"
context = "palette"
[[bindings]]
keys = "cmd+v"
command = "edit.paste"
context = "palette"

# GUI Find / Go to Line use explicit chords; Cmd remains distinct from Ctrl.
[[bindings]]
keys = "cmd+f"
command = "search.find"
[[bindings]]
keys = "cmd+g"
command = "navigation.goToLine"
