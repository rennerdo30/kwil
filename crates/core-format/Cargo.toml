[package]
name = "kwil-core-format"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde_json = { version = "1.0.154", features = ["raw_value"] }
toml_edit = "0.25.17"
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
