name: KW69 Windows repeats (temporary)

on: pull_request

permissions:
  contents: read

jobs:
  repeat:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: target
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-test
          add-rust-environment-hash-key: false
          save-if: false
      - name: Prove the three original interleavings fail
        shell: pwsh
        run: |
          Write-Output "commit $(git rev-parse HEAD), original-behavior mutations"
          $wrapPath = 'crates/view-model/src/wrap_session.rs'
          $wrap = [IO.File]::ReadAllText($wrapPath).Replace("`r`n", "`n")
          $guard = "        if state.retired.iter().any(Option::is_some) {`n            drop(state);`n            continue;`n        }`n"
          if (!$wrap.Contains($guard)) { throw 'Missing retirement predicate' }
          [IO.File]::WriteAllText($wrapPath, $wrap.Replace($guard, ''))
          $journalPath = 'crates/view-model/src/document_worker.rs'
          $journal = [IO.File]::ReadAllText($journalPath).Replace("`r`n", "`n")
          $guard = "    if matches!(request, DocumentRequest::FlushJournals) {`n        return !deferred.iter().take(before).any(|older| journal_document(older).is_some());`n    }`n"
          if (!$journal.Contains($guard)) { throw 'Missing flush ordering predicate' }
          [IO.File]::WriteAllText($journalPath, $journal.Replace($guard, ''))
          $themePath = 'crates/view-model/src/theme_session_tests.rs'
          $theme = [IO.File]::ReadAllText($themePath).Replace("`r`n", "`n")
          $needle = "    f.wait(|f| {`n        !f.settings.is_saving()`n            && f.themes.settings.name.starts_with(`"ocean-`")"
          if (!$theme.Contains($needle)) { throw 'Missing import completion wait' }
          # Pending cannot clear until the UI applies Saved. Exercise the old
          # direct read before applying it, independently of filesystem timing.
          [IO.File]::WriteAllText($themePath, $theme.Replace($needle, "    let _ = f.saved();`n" + $needle))
          $output = cargo test -p kwil-view-model --locked --lib -- wrap_atomic_intake_stale_ready journal_scheduler_flush_waits theme_import_path_enters 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 101) { throw "Expected failing original controls, exit $code" }
          $joined = $output -join "`n"
          foreach ($name in @('wrap_atomic_intake_stale_ready', 'journal_scheduler_flush_waits', 'theme_import_path_enters')) {
            if ($joined -notmatch "test [^\r\n]*$name[^\r\n]*FAILED") { throw "Missing expected failure: $name" }
          }
          git restore --source=HEAD -- $wrapPath $journalPath $themePath
          if ($LASTEXITCODE -ne 0) { throw 'Restore fixed source failed' }
      - name: Repeat affected controls 30 times
        shell: pwsh
        run: |
          Write-Output "commit $(git rev-parse HEAD)"
          for ($round = 1; $round -le 30; $round++) {
            Write-Output "KW69 Windows repeat $round/30"
            cargo test -p kwil-view-model --locked --lib -- workspace_document_shutdown theme_session::tests wrap_atomic_intake_stale_ready journal_scheduler_flush_waits
            if ($LASTEXITCODE -ne 0) { throw "KW69 repeat $round failed" }
          }
