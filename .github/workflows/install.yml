name: Installer checks

on:
  pull_request:
    paths: ['installer/**', 'scripts/install.*', 'scripts/test-install*', 'scripts/*static-runtime.py', 'scripts/package-windows.ps1', 'scripts/test-nsis-installer.ps1', 'scripts/capture-nsis.ps1', 'scripts/build-installer-art.py', 'assets/logo/**', '.github/workflows/install.yml', '.github/workflows/release.yml']
  push:
    branches: [main]
    paths: ['installer/**', 'scripts/install.*', 'scripts/test-install*', 'scripts/*static-runtime.py', 'scripts/package-windows.ps1', 'scripts/test-nsis-installer.ps1', 'scripts/capture-nsis.ps1', 'scripts/build-installer-art.py', 'assets/logo/**', '.github/workflows/install.yml', '.github/workflows/release.yml']

permissions:
  contents: read

jobs:
  static-windows:
    name: Static runtime (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }} --no-self-update
      - run: cargo build --release --locked -j 4 -p kwil --features windows-console --target ${{ matrix.target }}
      - name: Inspect GUI and console runtime imports
        shell: bash
        run: |
          python scripts/check-static-runtime.py \
            target/${{ matrix.target }}/release/kwil.exe \
            target/${{ matrix.target }}/release/kwil-console.exe
      - name: Version smoke
        shell: pwsh
        run: |
          & target/${{ matrix.target }}/release/kwil-console.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # Same packaging as release.yml; release builds embed the real notices.
      - name: NSIS setup and zip
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$').Matches[0].Groups[1].Value
          Set-Content notices.txt 'Third-party notices placeholder for installer checks.'
          $release = 'target/${{ matrix.target }}/release'
          ./scripts/package-windows.ps1 -Target ${{ matrix.target }} -Version $version -Exe "$release/kwil.exe" -Com "$release/kwil-console.exe" -Notices notices.txt -OutDir packages -InstallNsis
      - name: Published setup upgrade and user-data preservation
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # beta.7 is the published predecessor of the beta.8 candidate and
          # exercises migration from the pre-template installer, not two
          # freshly generated copies of the new template.
          $previous = '0.1.0-beta.7'
          $asset = "kwil-$previous-windows-x64-setup.exe"
          gh release download "v$previous" --repo rennerdo30/kwil --pattern $asset --pattern SHA256SUMS --dir previous
          if ($LASTEXITCODE) { throw 'Previous release download failed' }
          $lines = @(Get-Content previous/SHA256SUMS | Where-Object { $_ -match "^[a-fA-F0-9]{64}\s+\*?$([regex]::Escape($asset))$" })
          if ($lines.Count -ne 1) { throw 'Expected one checksum for the previous setup' }
          $expected = ($lines[0] -split '\s+')[0]
          if ((Get-FileHash "previous/$asset" -Algorithm SHA256).Hash -ne $expected) { throw 'Previous setup checksum mismatch' }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$').Matches[0].Groups[1].Value
          ./scripts/test-nsis-installer.ps1 -Setup (Resolve-Path "packages/kwil-$version-windows-x64-setup.exe") -Version $version -PreviousSetup (Resolve-Path "previous/$asset") -PreviousVersion $previous -CapturePath "$env:RUNNER_TEMP/kwil-setup.png"
      - name: Retain setup and native welcome-page capture
        if: always() && matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v6
        with:
          name: kwil-nsis-lifecycle
          path: |
            packages/*-setup.exe
            ${{ runner.temp }}/kwil-setup.png
  fixtures:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Runtime import rejection fixtures
        run: python3 -I scripts/test-static-runtime.py
      - name: Windows installer offline fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1 -FixtureRoot (Join-Path $env:RUNNER_TEMP ('kwil-install-' + [guid]::NewGuid()))
      - name: Unix installer offline fixtures
        if: runner.os != 'Windows'
        run: python3 -I scripts/test-install-unix.py
