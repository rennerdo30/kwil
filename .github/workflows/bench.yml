name: Bench budgets

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: target
  CARGO_INCREMENTAL: 0

jobs:
  renderer:
    # The requested KW-11 measurement uses the existing finite frame harness.
    # Startup is informational on hosted hardware; drawing invariants assert.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'bench')
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: Swatinem/rust-cache@v2
        with:
          add-rust-environment-hash-key: false
          key: bench-renderer-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the release renderer probe
        run: cargo build --release --locked -p kwil --features kwil-ui-gpu/frame-harness -j 4
      - name: Python environment
        run: python -m venv .renderer-venv
      - name: Measure hidden CPU and automatic presentation
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          .renderer-venv/Scripts/python.exe scripts/measure-renderer.py --executable target/release/kwil.exe --output target/renderer-results --commit $commit --renderer cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .renderer-venv/Scripts/python.exe scripts/measure-renderer.py --executable target/release/kwil.exe --output target/renderer-results --commit $commit --renderer auto --warp
          exit $LASTEXITCODE
      - name: Summarize first content and damage measurements
        if: always()
        shell: pwsh
        run: |
          '## KW-11 hidden renderer (one sample per backend)' >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem target/renderer-results -Filter result.json -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            $r = Get-Content $_.FullName -Raw | ConvertFrom-Json
            "- $($r.renderer): first frame $($r.first_frame_ms) ms; first file content $($r.first_content_ms) ms; 40 ms target met: $($r.within_content_target)." >> $env:GITHUB_STEP_SUMMARY
            "  Backend: $($r.backend); WARP: $($r.warp). Hosted timing is informational; no owner-PC or remote-wire acceptance." >> $env:GITHUB_STEP_SUMMARY
            $r.counts.PSObject.Properties | ForEach-Object {
              "  $($_.Name): $($_.Value | ConvertTo-Json -Compress)" >> $env:GITHUB_STEP_SUMMARY
            }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: renderer-windows-attempt-${{ github.run_attempt }}
          path: target/renderer-results/
          if-no-files-found: error
  startup:
    # Measurements only: neither timing misses nor an unavailable desktop gate a PR.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'bench')
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          add-rust-environment-hash-key: false
          key: startup-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libvulkan-dev libegl1-mesa-dev xvfb
      - name: Build the release app with opt-in startup trace
        run: cargo build --release --locked -j 4 -p kwil --features startup-bench
      - name: First frame, file content and second-launch display (informational)
        timeout-minutes: 4
        shell: bash
        run: |
          exe=target/release/kwil
          [ ! -f "$exe.exe" ] || exe="$exe.exe"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python scripts/bench-startup.py "$exe" results/startup-${{ matrix.os }}
          else
            python scripts/bench-startup.py "$exe" results/startup-${{ matrix.os }}
          fi
      - name: macOS palette over 100k files (informational)
        if: always() && runner.os == 'macOS'
        timeout-minutes: 5
        env:
          CARGO_TARGET_DIR: target-palette
          KWIL_PALETTE_PROFILE: 1
        shell: bash
        run: |
          mkdir -p results
          cargo build --manifest-path crates/bench-palette/Cargo.toml --release --locked -j 4
          git rev-parse HEAD > results/palette-profile-macos-15.log
          target-palette/release/kwil-palette-bench "$RUNNER_TEMP/kwil-palette-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > results/palette-macos-15.json 2>> results/palette-profile-macos-15.log
          python -c 'import json,os; r=json.load(open("results/palette-macos-15.json")); print(r); open(os.environ["GITHUB_STEP_SUMMARY"],"a").write("\nPalette (informational): " + str(r) + "\n")'
      - name: Retain startup traces and measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: responsiveness-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: results
          if-no-files-found: warn

  budgets:
    # Optional performance check: never add this job to required branch checks.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'bench')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          add-rust-environment-hash-key: false
          key: bench-core-${{ hashFiles('Cargo.lock', 'crates/bench/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build core-text measurement binary
        run: cargo build --manifest-path crates/bench/Cargo.toml --release --locked -j 4 --features harness
      - name: Check the isolated benchmark workspace
        shell: bash
        run: |
          cargo fmt --manifest-path crates/bench/Cargo.toml --check
          cargo clippy --manifest-path crates/bench/Cargo.toml --all-targets --features harness --locked -j 4 -- -D warnings
      - name: Cache generated fixtures
        id: fixtures
        uses: actions/cache/restore@v6
        with:
          path: fixtures
          key: bench-core-fixtures-v1-${{ matrix.os }}-${{ hashFiles('crates/bench/src/fixtures.rs') }}
      - name: Generate the required fixture on demand
        shell: bash
        run: target/release/kwil-bench generate fixtures
      - name: Read reviewed OS baseline
        shell: bash
        run: |
          mkdir -p baseline
          git fetch origin bench-baseline
          git show FETCH_HEAD:${{ matrix.os }}.json > baseline/current.json
          git show FETCH_HEAD:reference.json > baseline/reference.json
          git rev-parse FETCH_HEAD > baseline/commit.txt
      - name: Python environment
        shell: bash
        run: python -m venv .bench-venv
      - name: Read the trusted reference source
        id: baseline
        shell: bash
        run: |
          py=.bench-venv/bin/python
          [ -f .bench-venv/Scripts/python.exe ] && py=.bench-venv/Scripts/python.exe
          "$py" -c 'import json,re; from pathlib import Path; s=json.loads(Path("baseline/reference.json").read_text())["source_head"]; assert re.fullmatch("[0-9a-f]{40}",s); print("source="+s)' >> "$GITHUB_OUTPUT"
      - name: Check out the pinned baseline code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.baseline.outputs.source }}
          path: .bench-reference
          persist-credentials: false
      - name: Build baseline measurement binary before sampling either version
        working-directory: .bench-reference
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-reference
        # --manifest-path supports both the original workspace member and the
        # isolated layout, so a reviewed future baseline refresh stays buildable.
        run: cargo build --manifest-path crates/bench/Cargo.toml --release --locked -j 4 --features harness
      - name: Divan API benchmarks (nine samples, one operation per sample)
        shell: bash
        env:
          KWIL_FIXTURES: ${{ github.workspace }}/fixtures
        run: cargo bench --manifest-path crates/bench/Cargo.toml --locked -j 4 --features harness --bench text -- --sample-count 9 --sample-size 1
      - name: Gate contract tests
        shell: bash
        run: |
          py=.bench-venv/bin/python
          [ -f .bench-venv/Scripts/python.exe ] && py=.bench-venv/Scripts/python.exe
          "$py" crates/bench/test_gate.py
          "$py" crates/bench/test_pairs.py
      - name: Balanced paired hard and regression gates
        shell: bash
        run: |
          py=.bench-venv/bin/python
          [ -f .bench-venv/Scripts/python.exe ] && py=.bench-venv/Scripts/python.exe
          "$py" crates/bench/run.py --bin-dir target/release --fixtures fixtures --runner '${{ matrix.os }}' --runs 8 --output results/${{ matrix.os }}.json --baseline baseline/current.json --reference-bin-dir target-reference/release --reference-source .bench-reference --reference-manifest baseline/reference.json
      - name: Retain the exact trusted baseline inputs
        if: always()
        shell: bash
        run: |
          mkdir -p results/baseline
          for file in baseline/current.json baseline/reference.json baseline/commit.txt; do
            [ ! -f "$file" ] || cp "$file" results/baseline/
          done
      - name: Check the separate palette benchmark workspace
        if: always()
        # Informational like the measurement below; never blocks the core gate.
        continue-on-error: true
        env:
          CARGO_TARGET_DIR: target-palette
        shell: bash
        run: |
          cargo fmt --manifest-path crates/bench-palette/Cargo.toml --check
          cargo clippy --manifest-path crates/bench-palette/Cargo.toml --all-targets --locked -j 4 -- -D warnings
          cargo test --manifest-path crates/bench-palette/Cargo.toml --locked -j 4 palette::tests
      - name: Palette query over 100k files (informational)
        if: always()
        id: palette
        continue-on-error: true
        timeout-minutes: 5
        env:
          CARGO_TARGET_DIR: target-palette
          KWIL_PALETTE_PROFILE: 1
        shell: bash
        run: |
          mkdir -p results
          cargo build --manifest-path crates/bench-palette/Cargo.toml --release --locked -j 4
          git rev-parse HEAD > results/palette-profile-${{ matrix.os }}.log
          target-palette/release/kwil-palette-bench "$RUNNER_TEMP/kwil-palette-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > results/palette-${{ matrix.os }}.json 2>> results/palette-profile-${{ matrix.os }}.log
      - name: Summarize benchmarks
        if: always()
        shell: pwsh
        run: |
          "## Benchmarks (${{ matrix.os }})" >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path 'results/${{ matrix.os }}.json') {
            $text = Get-Content 'results/${{ matrix.os }}.json' -Raw | ConvertFrom-Json
            "`nCore-text medians:" >> $env:GITHUB_STEP_SUMMARY
            $text.medians.PSObject.Properties | ForEach-Object {
              "- $($_.Name): $($_.Value)" >> $env:GITHUB_STEP_SUMMARY
            }
          }
          if ('${{ steps.palette.outcome }}' -eq 'success') {
            $palette = Get-Content 'results/palette-${{ matrix.os }}.json' -Raw | ConvertFrom-Json
            $comparison = if ($palette.within_target) { 'within' } else { 'MISSES' }
            "`nPalette: **$($palette.query_results_ms) ms** query-to-fresh-results over $($palette.files) files; $comparison the 16 ms target (informational, non-blocking)." >> $env:GITHUB_STEP_SUMMARY
            "Query: $($palette.query); matches: $($palette.matches); displayed rows: $($palette.rows). One sample, discovery excluded; no GUI/TUI presentation timing." >> $env:GITHUB_STEP_SUMMARY
            Get-Content 'results/palette-profile-${{ matrix.os }}.log' >> $env:GITHUB_STEP_SUMMARY
          } else {
            "`nPalette measurement unavailable (step: ${{ steps.palette.outcome }}); no timing acceptance claimed." >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Retain raw samples, medians and commit even on gate failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: results
          if-no-files-found: error
      - name: Preserve completed fixture even when a performance gate fails
        if: always() && steps.fixtures.outputs.cache-hit != 'true' && hashFiles('fixtures/log-1g.log') != ''
        uses: actions/cache/save@v6
        with:
          path: fixtures
          key: ${{ steps.fixtures.outputs.cache-primary-key }}
