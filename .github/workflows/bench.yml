name: Bench budgets

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      diagnostic_aa:
        description: Also collect hosted A/A evidence (never grants production acceptance)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: target
  CARGO_INCREMENTAL: 0
  KWIL_NO_UPDATE: 1

jobs:
  budgets:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'bench')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: X11 runtime libraries for the real window smoke
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-0
      - uses: Swatinem/rust-cache@v2
        with:
          add-rust-environment-hash-key: false
          key: bench-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build measurement binaries
        run: cargo build --release --locked -j 4 -p kwil-bench --features harness -p kwil --features frame-harness
      - name: Cache generated fixtures
        id: fixtures
        uses: actions/cache/restore@v6
        with:
          path: fixtures
          key: bench-fixtures-v1-${{ matrix.os }}-${{ hashFiles('crates/bench/src/fixtures.rs') }}
      - name: Generate fixtures on demand
        shell: bash
        run: target/release/kwil-bench generate fixtures --all
      - name: Read reviewed OS baseline
        shell: bash
        run: |
          mkdir -p baseline
          if git fetch origin bench-baseline; then
            git show FETCH_HEAD:${{ matrix.os }}.json > baseline/current.json
            git show FETCH_HEAD:reference.json > baseline/reference.json
            git rev-parse FETCH_HEAD > baseline/commit.txt
          fi
      - name: Python environment
        shell: bash
        run: python -m venv .bench-venv
      - name: Read the trusted reference source
        id: baseline
        shell: bash
        run: |
          py=.bench-venv/bin/python
          [ -f .bench-venv/Scripts/python.exe ] && py=.bench-venv/Scripts/python.exe
          "$py" -c 'import json,re; from pathlib import Path; s=json.loads(Path("baseline/reference.json").read_text())["source_head"]; assert re.fullmatch("[0-9a-f]{40}",s); print("source="+s)' >> "$GITHUB_OUTPUT"
      - name: Check out the pinned baseline code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.baseline.outputs.source }}
          path: .bench-reference
      - name: Build the baseline measurement binaries before sampling either version
        working-directory: .bench-reference
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-reference
        run: cargo build --release --locked -j 4 -p kwil-bench --features harness -p kwil --features frame-harness
      - name: Divan API benchmarks (nine samples, one operation per sample)
        shell: bash
        env:
          KWIL_FIXTURES: ${{ github.workspace }}/fixtures
        run: cargo bench --locked -j 4 -p kwil-bench --features harness --bench text -- --sample-count 9 --sample-size 1
      - name: Gate contract tests
        id: protocol
        shell: bash
        run: |
          py=.bench-venv/bin/python
          [ -f .bench-venv/Scripts/python.exe ] && py=.bench-venv/Scripts/python.exe
          "$py" crates/bench/test_gate.py
          "$py" crates/bench/test_diagnostic_aa.py
      - name: Real terminal startup trace (Linux PTY)
        if: runner.os == 'Linux'
        run: .bench-venv/bin/python crates/bench/tui_smoke.py target/release/kwil fixtures/log-1g.log results/tui-trace.txt
      - name: Hidden terminal startup trace (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./crates/bench/tui_smoke.ps1
      - name: Median-of-nine hard and regression gates
        id: gate
        shell: bash
        run: |
          py=.bench-venv/bin/python
          [ -f .bench-venv/Scripts/python.exe ] && py=.bench-venv/Scripts/python.exe
          if [ '${{ runner.os }}' = Linux ]; then
            xvfb-run -a "$py" crates/bench/run.py --bin-dir target/release --fixtures fixtures --runner '${{ matrix.os }}' --runs 9 --output results/${{ matrix.os }}.json --baseline baseline/current.json --reference-bin-dir target-reference/release --reference-source .bench-reference --reference-manifest baseline/reference.json
          else
            "$py" crates/bench/run.py --bin-dir target/release --fixtures fixtures --runner '${{ matrix.os }}' --runs 9 --output results/${{ matrix.os }}.json --baseline baseline/current.json --reference-bin-dir target-reference/release --reference-source .bench-reference --reference-manifest baseline/reference.json
          fi
      - name: DIAGNOSTIC ONLY - nine paired A/A rounds with identical executables
        id: aa
        if: >-
          ${{ !cancelled() && steps.protocol.outcome == 'success' &&
          (inputs.diagnostic_aa == true ||
           (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'bench-aa')) }}
        shell: bash
        env:
          PRODUCTION_GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          py=.bench-venv/bin/python
          [ -f .bench-venv/Scripts/python.exe ] && py=.bench-venv/Scripts/python.exe
          if [ '${{ runner.os }}' = Linux ]; then
            xvfb-run -a "$py" crates/bench/diagnostic_aa.py --bin-dir target/release --fixtures fixtures --runner '${{ matrix.os }}' --output results/diagnostic-aa-${{ matrix.os }}.json
          else
            "$py" crates/bench/diagnostic_aa.py --bin-dir target/release --fixtures fixtures --runner '${{ matrix.os }}' --output results/diagnostic-aa-${{ matrix.os }}.json
          fi
      - name: Retain separately labelled A/A diagnostic evidence
        if: always() && steps.aa.outcome != 'skipped' && steps.aa.outcome != ''
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-only-aa-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: results/diagnostic-aa-${{ matrix.os }}.json
          if-no-files-found: error
      - name: Retain the exact trusted baseline inputs
        if: always()
        shell: bash
        run: |
          mkdir -p results/baseline
          cp baseline/*.json baseline/commit.txt results/baseline/
      - name: Retain raw samples, medians and commit even on gate failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: results
          if-no-files-found: error
      - name: Preserve completed fixtures even when a performance gate fails
        if: always() && steps.fixtures.outputs.cache-hit != 'true' && hashFiles('fixtures/complete-v1') != ''
        uses: actions/cache/save@v6
        with:
          path: fixtures
          key: ${{ steps.fixtures.outputs.cache-primary-key }}
