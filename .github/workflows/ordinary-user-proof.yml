name: Ordinary user environment proof

# SOURCE CANDIDATE ONLY. Adding this file never dispatches provisioning.
# Owner's concrete approval AFTER independent source review remains external.
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: One fixed attempt on each selected native disposable VM
        type: choice
        required: true
        default: x64
        options: [x64, arm64, both]
      owner_approval_reference:
        description: Nonsecret reference to the final concrete owner approval
        type: string
        required: true

permissions:
  contents: read

jobs:
  environment:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'rennerdo30/kwil' &&
      github.actor == 'rennerdo30' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      contains(fromJSON('["x64","arm64","both"]'), inputs.architecture)
    name: Ordinary environment (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.architecture == 'both' && '[{"os":"windows-latest","architecture":"x64"},{"os":"windows-11-arm","architecture":"arm64"}]' || inputs.architecture == 'arm64' && '[{"os":"windows-11-arm","architecture":"arm64"}]' || '[{"os":"windows-latest","architecture":"x64"}]') }}
    runs-on: ${{ matrix.os }}
    # checkout60 + supervisor600 + evidence60 + orchestration180 = 900s.
    timeout-minutes: 15
    env:
      KWIL_PROOF_ARCH: ${{ matrix.architecture }}
      KWIL_DISPOSABLE_PROOF: ${{ github.run_id }}:${{ github.run_attempt }}:${{ github.sha }}
      KWIL_OWNER_APPROVAL_REFERENCE: ${{ inputs.owner_approval_reference }}
      KWIL_BOOTSTRAP_SHA256: 3d7fbc574055ba8d53e3d1087abd66c442697f7655a8f17cfa9481fce5c5f51e
      KWIL_SESSION_SHA256: 3ea494d73dd1ffdfd33c72f0f5012a713c76faa305f3ba6fa033cf53497a07b0
      KWIL_CONTROLS_SHA256: 6d4230b4e4133225810a331f8552961adf8a2822d1ace0d4d473634b3cf2503e
    steps:
      - name: Read the fixed dispatched main source
        uses: actions/checkout@v7
        timeout-minutes: 1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: One ordinary-user environment proof (no installer attachment)
        timeout-minutes: 10
        shell: pwsh
        run: |
          # Text/source checks precede all Add-Type/native/provisioning.
          $ErrorActionPreference='Stop'
          if($env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $env:GITHUB_RUN_ATTEMPT -cne '1' -or $env:GITHUB_REF -cne 'refs/heads/main') { throw 'manual-main-first-attempt-only' }
          if($env:KWIL_OWNER_APPROVAL_REFERENCE -cnotmatch '\A[a-zA-Z0-9][a-zA-Z0-9._:/-]{0,127}\z') { throw 'nonsecret-owner-approval-reference-required' }
          $pins=@{
            'scripts/ci-ordinary-user-bootstrap.ps1'=$env:KWIL_BOOTSTRAP_SHA256
            'scripts/ci-ordinary-user-session.ps1'=$env:KWIL_SESSION_SHA256
            'scripts/test-ci-ordinary-user.ps1'=$env:KWIL_CONTROLS_SHA256
          }
          foreach($path in $pins.Keys) {
            $hash=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if($hash -cne $pins[$path]) { throw 'reviewed-source-pin-mismatch' }
          }
          # No untrusted path/account/ref/command input reaches the bootstrap.
          ./scripts/ci-ordinary-user-bootstrap.ps1
          if($LASTEXITCODE -ne 0) { throw 'ordinary-proof-failed-no-retry' }
      - name: Keep only bounded nonsecret environment outcome
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: ordinary-user-environment-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kwil-ordinary-evidence/environment-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
