name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Keep a weekly sample even when no commits land.
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml points at the owner PC's cache folder; CI builds in-tree.
  CARGO_TARGET_DIR: target
  # CI builds from scratch or from the cache: incremental state and debug
  # info only make the cache bigger and the links slower.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_NET_RETRY: 10

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check

  # Every shipped dependency license must be accepted in about.toml; the
  # release workflow generates THIRD-PARTY-NOTICES.txt the same way.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: cargo about generate -o THIRD-PARTY-NOTICES.txt about.hbs && wc -c THIRD-PARTY-NOTICES.txt

  test:
    name: test (${{ matrix.os }})
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - run: rustup show active-toolchain
      - name: Configure compiler cache
        id: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # Caches ~/.cargo (registry, git) and target/ dependencies. The key is
      # OS + job + our own inputs (lockfile, pinned toolchain, cargo config);
      # rust-cache's automatic environment hash also covers every toolchain
      # preinstalled on the runner image, so each image update missed the
      # cache. Only main writes the cache, so pull requests reuse it without
      # churning it; failed runs still save.
      - uses: Swatinem/rust-cache@v2
        with:
          add-rust-environment-hash-key: false
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked
      - name: Prove Linux association safe-open mutations
        if: runner.os == 'Linux'
        timeout-minutes: 15
        shell: pwsh
        run: |
          ./crates/core-commands/scripts/check-association-unix-mutations.ps1 -ProcessFixture
          ./crates/core-commands/scripts/check-association-unix-mutations.ps1
      - name: Prove Unix save permissions reject broken preservation
        if: runner.os != 'Windows'
        shell: pwsh
        run: ./crates/view-model/scripts/fail-first.ps1 -UnixOnly
      # The release profile (thin LTO, 1 codegen unit) is built only by the
      # release workflow; the smoke test uses the debug binary from the tests.
      - name: Smoke test
        shell: bash
        run: |
          cargo build --locked -p kwil --features kwil-ui-gpu/frame-harness
          exe=target/debug/kwil
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
          "$exe" --help > /dev/null
      - name: Compiler cache statistics
        if: always() && steps.sccache.outcome == 'success'
        run: sccache --show-stats

  # Clippy used to add 88-172 s before tests could start. Keep the exact
  # all-targets check on every OS, but take it off the test critical path.
  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          # Read the existing test dependency cache; only test jobs write it.
          shared-key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-test
          add-rust-environment-hash-key: false
          save-if: false
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - if: always()
        run: sccache --show-stats

  build-metrics:
    name: build metrics (${{ matrix.os }})
    # Measure main, the weekly sample and manual runs; pull requests skip the
    # extra clean builds so they never wait on them.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Independent target with no artifact/compiler cache: these measure the
    # development profile, not the stripped, non-incremental test profile.
    env:
      CARGO_TARGET_DIR: target/build-metrics
      CARGO_INCREMENTAL: 1
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - name: Python environment
        shell: bash
        run: python -m venv .metrics-venv
      - name: Measure clean build, core-text edit and ui-gpu edit
        shell: bash
        run: |
          py=.metrics-venv/bin/python
          [ -f .metrics-venv/Scripts/python.exe ] && py=.metrics-venv/Scripts/python.exe
          "$py" scripts/ci-build-metrics.py build --os '${{ matrix.os }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-metrics-${{ matrix.os }}
          overwrite: true
          path: target/build-metrics-report/
          if-no-files-found: error
          retention-days: 90

  metrics-report:
    name: CI wall time and weekly trend
    if: always() && !cancelled()
    needs: [fmt, licenses, test, clippy, build-metrics]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: build-metrics-*
          path: target/metrics-input
      - name: Python environment
        run: python -m venv .metrics-venv
      - name: Record job wall time and weekly medians
        env:
          GH_TOKEN: ${{ github.token }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .metrics-venv/bin/python scripts/ci-build-metrics.py report
      - uses: actions/upload-artifact@v7
        with:
          name: ci-metrics
          overwrite: true
          path: target/ci-metrics-report/
          if-no-files-found: error
          retention-days: 90
