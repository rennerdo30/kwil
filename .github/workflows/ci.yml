name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml points at the owner PC's cache folder; CI builds in-tree.
  CARGO_TARGET_DIR: target
  # CI builds from scratch or from the cache: incremental state and debug
  # info only make the cache bigger and the links slower.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_NET_RETRY: 10

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - run: rustup show active-toolchain
      - name: Configure compiler cache
        id: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # Caches ~/.cargo (registry, git) and target/ dependencies. The key is
      # OS + job + our own inputs (lockfile, pinned toolchain, cargo config);
      # rust-cache's automatic environment hash also covers every toolchain
      # preinstalled on the runner image, so each image update missed the
      # cache. Only main writes the cache, so pull requests reuse it without
      # churning it; failed runs still save.
      - uses: Swatinem/rust-cache@v2
        with:
          add-rust-environment-hash-key: false
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Prove Linux association safe-open mutations
        if: runner.os == 'Linux'
        timeout-minutes: 15
        shell: pwsh
        run: ./crates/core-commands/scripts/check-association-unix-mutations.ps1
      - name: Prove Unix save permissions reject broken preservation
        if: runner.os != 'Windows'
        shell: pwsh
        run: ./crates/view-model/scripts/fail-first.ps1 -UnixOnly
      # The release profile (thin LTO, 1 codegen unit) is built only by the
      # release workflow; the smoke test uses the debug binary from the tests.
      - name: Smoke test
        shell: bash
        run: |
          cargo build --locked -p kwil
          exe=target/debug/kwil
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
          "$exe" --help > /dev/null
      - name: Compiler cache statistics
        if: always() && steps.sccache.outcome == 'success'
        run: sccache --show-stats
