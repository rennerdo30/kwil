name: Release

# Pushing a tag vX.Y.Z builds every platform and creates a DRAFT release.
# Only the owner publishes it (docs/RELEASING.md); once published, installed
# copies pick it up through auto-update (crates/update).
#
# Assets: Windows setup + zip, macOS/Linux tar.gz (for people), the bare
# kwil-<target>[.exe|.com] binaries (for the updater; keep these names),
# THIRD-PARTY-NOTICES.txt and SHA256SUMS over all of them.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  CARGO_INCREMENTAL: 0

jobs:
  candidate-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI for the exact tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&status=success&per_page=1" --jq '.workflow_runs | length')
          if [ "$count" != "1" ]; then
            echo "The tagged commit must pass CI before release artifacts are built." >&2
            exit 1
          fi

  notices:
    needs: candidate-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # Fails on any dependency license not accepted in about.toml.
      - name: Third-party notices
        run: |
          mkdir -p notices
          cargo about generate -o notices/rust.txt about.hbs
          { cat notices/rust.txt; printf '\n\nSyntax grammars\n\n'; cat crates/core-syntax/LICENSES.txt; } > notices/THIRD-PARTY-NOTICES.txt
          wc -c notices/*
      - uses: actions/upload-artifact@v7
        with:
          name: notices
          path: notices/*
          if-no-files-found: error

  build:
    needs: [candidate-ci, notices]
    name: build (${{ matrix.target }})
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: .exe }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, ext: .exe }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: '' }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: '' }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: '' }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the workspace version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - run: rustup target add ${{ matrix.target }}
      - name: Configure compiler cache
        id: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # Dependencies cached per target; tags are rare, so this mainly helps
      # re-runs of a failed release.
      - uses: Swatinem/rust-cache@v2
        with:
          add-rust-environment-hash-key: false
          key: ${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          cache-on-failure: true
      - uses: actions/download-artifact@v8
        with:
          name: notices
          path: notices
      - name: Build platform entry points
        shell: bash
        env:
          KWIL_THIRD_PARTY_NOTICES: ${{ github.workspace }}/notices/rust.txt
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
        run: |
          features=()
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            features=(--features windows-console)
          fi
          cargo build --release --locked -p kwil --target ${{ matrix.target }} "${features[@]}"
      - name: Verify Windows static runtime in both entry points
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python scripts/check-static-runtime.py \
            target/${{ matrix.target }}/release/kwil.exe \
            target/${{ matrix.target }}/release/kwil-console.exe
      - name: Compiler cache statistics
        if: always() && steps.sccache.outcome == 'success'
        run: sccache --show-stats
      - name: Stage the binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/kwil${{ matrix.ext }}" "dist/kwil-${{ matrix.target }}${{ matrix.ext }}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/kwil-console.exe" "dist/kwil-${{ matrix.target }}.com"
          fi
      - name: Package (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) platform=macos-arm64 ;;
            x86_64-apple-darwin) platform=macos-x64 ;;
            x86_64-unknown-linux-gnu) platform=linux-x64 ;;
            aarch64-unknown-linux-gnu) platform=linux-arm64 ;;
          esac
          name="kwil-${GITHUB_REF_NAME#v}-$platform"
          mkdir -p "pkg/$name"
          install -m 755 "target/${{ matrix.target }}/release/kwil" "pkg/$name/kwil"
          cp LICENSE "pkg/$name/LICENSE.txt"
          cp notices/THIRD-PARTY-NOTICES.txt "pkg/$name/"
          tar -C pkg -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: kwil-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  windows-packages:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: kwil-*-windows-msvc
          path: bin
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: notices
          path: notices
      - name: Setup and zip
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          foreach ($target in 'x86_64-pc-windows-msvc', 'aarch64-pc-windows-msvc') {
            ./scripts/package-windows.ps1 -Target $target -Version $version -Exe "bin/kwil-$target.exe" -Com "bin/kwil-$target.com" -Notices notices/THIRD-PARTY-NOTICES.txt -OutDir dist -InstallNsis
          }
      - name: Install, run and uninstall the x64 setup
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./scripts/test-nsis-installer.ps1 -Setup "dist/kwil-$version-windows-x64-setup.exe" -Version $version
      - uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          path: dist/*
          if-no-files-found: error

  draft-release:
    needs: [build, windows-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          rm -f rust.txt
          sha256sum kwil-* THIRD-PARTY-NOTICES.txt > SHA256SUMS && cat SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft)
          notes=(--generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease --latest=false)
            notes=(--notes-file docs/BETA_RELEASE_NOTES.md)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            "${flags[@]}" \
            --title "Kwil $GITHUB_REF_NAME" \
            "${notes[@]}"
