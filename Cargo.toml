[workspace]
resolver = "3"
members = ["crates/*"]
# Spikes are separate workspaces so their heavy dependencies never enter the main build.
exclude = ["spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

# Build profiles live in .cargo/config.toml so the spike workspaces share them.
