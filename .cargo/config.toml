# Build output stays outside the repo (spec §9). No environment or PATH changes.
[build]
target-dir = "E:/Development/_cache/cargo-target/kwil"

# rust-lld is not the Windows default; it links much faster than link.exe.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

[profile.dev]
debug = "line-tables-only"   # small debug info; full debug only when needed

[profile.dev.package."*"]
opt-level = 2                # dependencies are fast at run time and compile once
debug = false

# The CPU compositor is also the interactive debug frontend. Keep debug
# assertions/onboarding, but do not run per-pixel painting without optimization.
[profile.dev.package.kwil-ui-gpu]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
# Drops symbol tables from Linux and macOS binaries; Windows keeps symbols in
# the separate .pdb either way.
strip = true

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
