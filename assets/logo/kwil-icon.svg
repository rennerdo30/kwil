<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Kwil</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16243d"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2fbff"/>
      <stop offset="0.45" stop-color="#8fe3ff"/>
      <stop offset="1" stop-color="#2f86ff"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8fe3ff"/>
      <stop offset="1" stop-color="#8fe3ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fe3ff"/>
      <stop offset="1" stop-color="#8fe3ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fb8ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4fb8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
  <ellipse cx="236" cy="290" rx="190" ry="190" fill="url(#glow)"/>

  <!-- The line being written -->
  <rect x="112" y="392" width="268" height="12" rx="6" fill="url(#ink)"/>

  <!-- Nib in flight: drawn tip-down, then turned so it writes toward the lower left -->
  <g transform="translate(232 284) rotate(45)">
    <!-- Speed trails behind the nib (drawn first, so the nib covers their ends) -->
    <rect x="-54" y="-250" width="18" height="160" rx="9" fill="url(#trail)"/>
    <rect x="-9" y="-292" width="18" height="170" rx="9" fill="url(#trail)"/>
    <rect x="36" y="-232" width="18" height="142" rx="9" fill="url(#trail)"/>
    <!-- Nib body -->
    <path d="M0 150 L-68 -6 C-76 -64 -48 -112 0 -140 C48 -112 76 -64 68 -6 Z" fill="url(#ice)"/>
    <!-- Shoulder line -->
    <path d="M-60 -40 Q0 -64 60 -40" fill="none" stroke="#0b1424" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round"/>
    <!-- Slit and breather hole -->
    <line x1="0" y1="138" x2="0" y2="22" stroke="#0b1424" stroke-width="10" stroke-linecap="round"/>
    <circle cx="0" cy="6" r="19" fill="#0b1424"/>
  </g>
</svg>
